services:
  - type: web
    name: lavanya-collections
    env: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: lavanyacollections@gmail.com
      - key: ADMIN_PASSWORD
        value: lavanyacollect
      - key: PHONEPE_NUMBER
        value: "6372556290"
      - key: PHONEPE_UPI_ID
        value: "6372556290@ybl"
      - key: MERCHANT_UPI_NAME
        value: "Lavanya Collections"
      - key: MONGODB_URI
        sync: false
